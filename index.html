<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7fb">
  <title>めっちゃだいすき</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #fff7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", Meiryo, sans-serif;
    }
    main {
      min-height: 100svh;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      max-width: 100%;
      white-space: nowrap;
      color: #ff5fa2;
      font-size: clamp(1.65rem, 7.2vw, 4.2rem);
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 2px 0 #ffd2e5, 0 5px 14px rgba(255, 95, 162, .12);
    }
  </style>
</head>
<body>
  <main>
    <h1>めっちゃだいすき</h1>
  </main>
</body>
</html>
